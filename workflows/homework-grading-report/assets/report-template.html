<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作业批改报告</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#2f3441;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;line-height:1.65}.container{max-width:980px;margin:0 auto;padding:28px 18px 48px}.header{background:linear-gradient(135deg,#667eea 0%,#7656b5 100%);color:#fff;padding:30px;border-radius:16px;margin-bottom:22px;box-shadow:0 8px 26px rgba(65,74,150,.14)}.header h1{margin:0 0 9px;font-size:28px}.subtitle{font-size:14px;opacity:.94}.date{font-size:12px;opacity:.82;margin-top:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat{background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.055)}.stat .n{font-size:32px;font-weight:800}.stat .l{font-size:12px;color:#727987}.total .n{color:#667eea}.correct .n{color:#38a169}.wrong .n{color:#e05252}.rate .n{color:#d2942e}.section{background:#fff;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.055)}.section-title{font-size:18px;font-weight:800;margin-bottom:16px;padding-bottom:9px;border-bottom:2px solid #7b86eb}table{width:100%;border-collapse:collapse}th{background:#f6f7fb;color:#606776;text-align:left;font-size:12px;padding:10px 9px;border-bottom:1px solid #e8eaf0}td{font-size:13px;padding:11px 9px;border-bottom:1px solid #eef0f4;vertical-align:top}.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}.ok{background:#edf8f1;color:#32805a}.bad{background:#fff0f0;color:#b54848}.pending{background:#fff7e8;color:#956823}.error-card{background:#fffaf0;border-left:4px solid #e7a93f;border-radius:0 10px 10px 0;padding:18px;margin:0 0 16px}.wrong-evidence{display:grid;gap:10px;margin:0 0 14px}.wrong-evidence img{display:block;width:100%;height:auto;border:1px solid #eadfca;border-radius:10px;background:#fff}.evidence-note{font-size:12px;color:#7f8794;background:#fff;border:1px dashed #ddd4c5;border-radius:8px;padding:10px 12px;margin-bottom:12px}.evidence-note.exception{color:#9b6820;background:#fff7e8}.error-head{display:flex;gap:10px;align-items:center;margin-bottom:12px}.qnum{min-width:30px;height:30px;border-radius:50%;background:#e7a93f;color:white;display:flex;align-items:center;justify-content:center;font-weight:800}.qtitle{font-weight:800}.qsource{font-size:11px;color:#89909d}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:#fff;padding:12px;border-radius:8px;border:1px solid #f0eadc}.detail.full{grid-column:1/-1}.label{font-size:11px;font-weight:800;color:#8a909d;margin-bottom:4px}.value{font-size:13px}.value.red{color:#b54848;font-weight:700}.value.green{color:#32805a;font-weight:700}.pattern{background:#f3f5ff;border:1px solid #e1e5ff;border-radius:10px;padding:12px 14px;margin:8px 0}.note{font-size:12px;color:#727987;margin-top:10px}.footer{text-align:center;color:#9aa0aa;font-size:11px;padding:12px}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}}@media print{body{background:#fff}.section,.stat,.header{box-shadow:none}}
</style>
</head>
<body>
<div class="container">
__HEADER__
__STATS__
__QUESTION_TABLE__
__ERROR_DETAILS__
__PATTERN_SUMMARY__
<div class="footer">标准化作业批改报告</div>
</div>
<script type="application/json" id="grading-data">__DATA_JSON__</script>
</body>
</html>
