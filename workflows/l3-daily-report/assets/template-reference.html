<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L3 学业管理日看板</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#202534;--muted:#71798a;--line:#e5e9f1;--pri:#6676ee;--pri2:#7f89ed;--ps:#eef1ff;--green:#4b9875;--gs:#edf8f3;--amber:#b98232;--as:#fff7e8;--red:#c45e5e;--rs:#fff0f0;--blue:#4f79bf;--bs:#eef4ff;--violet:#8067c4;--vs:#f3efff;--shadow:0 7px 25px rgba(37,44,67,.055)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;line-height:1.7}.wrap{max-width:1140px;margin:auto}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:40px 22px 32px}h1{margin:0;font-size:28px}.sub{opacity:.94;margin-top:8px;font-size:14px}.route-strip{margin-top:15px;padding:11px 13px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.27);border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.route-strip b{font-size:13px}.route-badge{background:#fff;color:#5966d1;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800}.route-note{font-size:12px;opacity:.94}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.pill{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.13);border-radius:999px;padding:5px 11px;font-size:12px}
nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}nav .wrap{display:flex;gap:4px;overflow:auto;padding:9px 16px}nav a{text-decoration:none;color:#596071;font-size:13px;padding:6px 10px;white-space:nowrap;border-radius:999px}nav a:hover{background:var(--ps);color:var(--pri)}
main{padding:28px 18px 54px}section{margin-bottom:28px}h2{font-size:21px;margin:0 0 5px}.desc{font-size:13px;color:var(--muted);margin:0 0 14px}.card,.stat,.evidence,.lesson,.route-module,.analysis-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.card,.analysis-card{padding:17px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}th,td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;font-size:13px}th{background:#f0f2fa;font-weight:700}tr:last-child td{border-bottom:none}.subject{font-weight:800;white-space:nowrap}.check{font-size:19px;font-weight:800}.done{color:var(--green)}.todo{color:#aeb3bf}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-right:5px}.tag.green{background:var(--gs);color:#3f8064}.tag.amber{background:var(--as);color:#996a29}.tag.blue{background:var(--bs);color:#456da9}.tag.gray{background:#f1f2f5;color:#676d79}.tag.red{background:var(--rs);color:#ab4f4f}.tag.violet{background:var(--vs);color:#6d54ad}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{padding:15px}.stat .l{font-size:12px;color:var(--muted)}.stat .v{font-size:23px;font-weight:800;margin-top:3px}.stat .s{font-size:11px;color:var(--muted);margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.note,.callout{padding:13px 15px;border-radius:10px;font-size:13px}.note{background:#fafbfc;border:1px solid var(--line)}.callout{background:var(--ps);border-left:4px solid var(--pri)}.callout.green{background:var(--gs);border-left-color:var(--green)}.callout.amber{background:var(--as);border-left-color:var(--amber)}
.tabs{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.tab-bar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfbfd;overflow:auto}.tab-btn{appearance:none;border:none;background:transparent;color:#676d79;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}.tab-btn.active{background:var(--ps);color:var(--pri)}.tab-panel{display:none;padding:16px}.tab-panel.active{display:block}
.evidence{padding:14px}.evidence h3{margin:0 0 9px;font-size:15px}.evidence img{display:block;width:100%;border-radius:10px;border:1px solid #e5e7ed;background:#fff}.evidence-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;align-items:start}.wrong-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.wrong-card-grid .evidence{min-width:0}.wrong-card-grid .evidence img{width:100%;height:auto}.wrong-card-grid .error-meta{grid-template-columns:1fr}.record-table{box-shadow:none}.small{font-size:12px;color:var(--muted);margin-top:8px}details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:10px}summary{cursor:pointer;font-weight:700;font-size:13px}
.habit-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.habit{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px}.habit b{display:block;font-size:12px;margin-bottom:4px}.habit span{font-size:12px;color:#5d6472}.lesson{padding:15px;border-left:4px solid var(--violet)}.lesson h3{margin:0 0 6px;font-size:16px}.feedback{margin-top:10px;padding:11px 12px;background:#faf9ff;border-radius:9px;font-size:13px}
.error-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.error-field{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;font-size:12px}.error-field b{display:block;color:#52596a;margin-bottom:2px}.analysis-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.analysis-card h3{margin:0 0 9px;font-size:16px}.focus-list{display:grid;gap:9px}.focus-item{background:#fff;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:12px 14px}.focus-item b{display:block;margin-bottom:3px}.status-good{color:#3f8064;font-weight:800}.status-watch{color:#9a6a28;font-weight:800}.status-alert{color:#b14e4e;font-weight:800}.problem-chain{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;font-size:13px}.problem-chain>div{padding:8px 0;border-bottom:1px dashed var(--line)}.problem-chain .label{color:var(--muted);font-weight:700}
.session-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.session-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.session-card h3{margin:0 0 10px}.session-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.session-kpi{padding:10px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;text-align:center}.session-kpi .n{font-size:21px;font-weight:800}.session-kpi .t{font-size:11px;color:var(--muted)}
.route-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.route-module{overflow:hidden}.route-module h3{margin:0;padding:13px 15px;background:#eef1f8;font-size:16px}.route-module .inner{padding:14px}.trend-good{color:#3f8064;font-weight:800}.trend-watch{color:#996a29;font-weight:800}.trend-bad{color:#ad5151;font-weight:800}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:31px}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.grid2,.grid3,.evidence-grid,.wrong-card-grid,.route-grid,.analysis-grid,.session-grid{grid-template-columns:1fr}.habit-grid{grid-template-columns:1fr 1fr}.error-meta{grid-template-columns:1fr}h1{font-size:23px}}@media print{nav{display:none}body{background:#fff}.card,.stat,.evidence,.lesson,.tabs,.route-module,.analysis-card,.session-card{box-shadow:none}}
</style></head><body>__HEADER____NAV__<main class="wrap">__MAIN__</main><script>
document.querySelectorAll('.tab-btn').forEach(function(btn){btn.addEventListener('click',function(){var box=btn.closest('.tabs');box.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});box.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active')});btn.classList.add('active');box.querySelector('#'+btn.dataset.tab).classList.add('active')})});
</script></body></html>
